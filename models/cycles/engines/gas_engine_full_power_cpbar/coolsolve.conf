# Solver configuration of CSL-0034 gas_engine_full_power_cpbar.
#
# The nominal point of the original exercise imposes W_dot_sh = 0, so t_7 = t_6
# and the mean specific heat of the products between t_6 and t_7 is the limit
# hp/(T_p1 - T_p2) = (h(t_6) - h(t_7))/(t_6 - t_7) for t_7 -> t_6. The equation
# M_dot_g*c_p_g_67*(t_6 - t_7) = W_dot_sh is then satisfied identically, but the
# 0/0 limit can only be resolved to the accuracy of the property evaluation:
# the block residual stops at ~1E-5 W instead of 1E-9 W (EES stores the same
# degenerate point: t_6 = t_7 = 1963.098531 C). The default tolerance is
# therefore relaxed to 1E-4.
tolerance = 1E-4
