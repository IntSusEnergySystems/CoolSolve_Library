# Solver configuration for CSL-0041 ice_storage_tank_discharge_phase_change
# (runnable variant). The INTEGRAL call has no explicit step, so CoolSolve
# takes exactly integralMaxSteps fixed steps over 0..50000 s: 6000 steps of
# 8.33 s (a row of the integral table every second step, 3001 rows). With the
# default 1000 the run would use 50-s steps and give a coarser trajectory.
# (CoolSolve v0.3.0, CS-BUG-INTEGRAL-MAXSTEPS: the run stopped silently
# before 50000 s with the default value; closed in fix/library-gaps-2.)
integralMaxSteps = 6000
