# Solver configuration for CSL-0009 dhw_tank_dynamic (runnable variant).
# The variant integrates 0..18000 s with the 1-s fixed step of the original
# (18 000 steps). The default integralMaxSteps = 1000 silently truncates the
# integration at 4000 s while reporting SUCCESS (CS-BUG-INTEGRAL-MAXSTEPS,
# the step counter is compared against maxSteps*4); raise it.
integralMaxSteps = 20000
